name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # cloudflare-env.d.ts is generated, not committed.
      - run: npx wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts

      - run: npm run typecheck

      - run: npm run lint

      # Runs the OpenNext build *and* scripts/patch-opennext-manifests.mjs.
      # Deploying the unpatched handler breaks pages whose manifests are absent.
      - run: npm run build:cloudflare

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
